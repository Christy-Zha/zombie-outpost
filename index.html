<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="尸潮据点">
<meta name="theme-color" content="#14170f">
<title>尸潮据点</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<!-- 让模型加载器里的 import 'three' 指向本地文件（和游戏用的是同一份） -->
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="gl"></canvas>

<!-- 加载中 -->
<div id="loading" class="loading"><div class="logo">尸潮据点</div><div class="muted">加载中……</div></div>

<!-- 基地界面 -->
<div id="baseUI" class="screen hidden">
  <div class="topbar">
    <div class="res"><span>🔩</span><b id="rScrap">0</b><small>物资</small></div>
    <div class="res"><span>🌽</span><b id="rFood">0</b><small>食物</small></div>
    <div class="res"><span>👥</span><b id="rSurv">0/2</b><small>幸存者</small></div>
    <button id="btnSound" class="icon-btn" aria-label="声音">🔊</button>
  </div>
  <div class="title">尸潮据点</div>
  <div class="panel">
    <div class="tabs">
      <button data-tab="build" class="active">🏗️ 建设</button>
      <button data-tab="people">👥 幸存者</button>
      <button data-tab="gear">🎒 装备</button>
      <button data-tab="go">⚔️ 出征</button>
    </div>
    <div class="store-bar">
      <div id="storeInfo"></div>
      <button id="btnCollect" class="btn small">收取</button>
    </div>
    <div class="tab-body" id="tab-build"></div>
    <div class="tab-body hidden" id="tab-people"></div>
    <div class="tab-body hidden" id="tab-gear"></div>
    <div class="tab-body hidden" id="tab-go"></div>
  </div>
</div>

<!-- 战斗界面 -->
<div id="battleUI" class="screen hidden">
  <div class="hud-top">
    <div class="bars">
      <div class="bar hp"><i id="hpFill"></i><span id="hpText"></span></div>
      <div class="bar xp"><i id="xpFill"></i><span id="lvText">Lv 1</span></div>
    </div>
    <button id="btnPause" class="icon-btn" aria-label="暂停">⏸</button>
  </div>
  <div class="hud-stats">
    <span>⏱ <b id="hTime">5:00</b></span>
    <span>💀 <b id="hKills">0</b></span>
    <span>🔩 <b id="hScrap">0</b></span>
    <span id="sSurv">🙌 <b id="hSurv">0</b></span>
    <span id="sAmmo" class="hidden">🔫 <b id="hAmmo">0</b></span>
  </div>
  <div id="hObj" class="hud-obj hidden"></div>
  <div id="bossBar" class="bar boss hidden"><i id="bossFill"></i><span>☠️ 尸王</span></div>
  <div id="hMsg" class="hud-msg"></div>
  <div id="joy" class="joy hidden"><div id="joyKnob"></div></div>
  <div id="joyAim" class="joy aim hidden"><div id="joyAimKnob"></div></div>
  <div id="joyHint" class="joy-hint"><span>👈 左边拖动：移动</span><span>右边拖动：瞄准 👉</span></div>
  <div id="hurt" class="hurt"></div>
</div>

<!-- 剧情对白 -->
<div id="dlg" class="dlg hidden">
  <div class="dlg-bar top"></div>
  <button id="dlgSkip" class="dlg-skip">跳过 ⏭</button>
  <div class="dlg-box">
    <div id="dlgName" class="dlg-name"></div>
    <div id="dlgText" class="dlg-text"></div>
    <div class="dlg-hint">点击继续 ▼</div>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
