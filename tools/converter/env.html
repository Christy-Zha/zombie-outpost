<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"../../vendor/three.module.min.js"}}</script>
</head><body>
<script type="module">
// Poly Haven 素材压缩页（由 tools/env_assets.mjs 在无界面浏览器里调用）
import * as THREE from 'three';
import { GLTFLoader } from '../../vendor/GLTFLoader.js';
import { GLTFExporter } from './jsm/exporters/GLTFExporter.js';
import { MeshoptSimplifier } from './jsm/libs/meshopt_simplifier.module.js';
import { mergeVertices } from '../../vendor/utils/BufferGeometryUtils.js';

// 删掉减面后没被用到的顶点（否则文件里还留着全部顶点数据）
function compactGeometry(g) {
  const idx = g.index.array, count = g.attributes.position.count;
  const map = new Int32Array(count).fill(-1);
  const newIdx = new Uint32Array(idx.length);
  let n = 0;
  for (let i = 0; i < idx.length; i++) { const v = idx[i]; if (map[v] < 0) map[v] = n++; newIdx[i] = map[v]; }
  for (const name of Object.keys(g.attributes)) {
    const a = g.attributes[name], k = a.itemSize;
    const arr = new (a.array.constructor)(n * k);
    for (let v = 0; v < count; v++) {
      const t = map[v];
      if (t < 0) continue;
      for (let c = 0; c < k; c++) arr[t * k + c] = a.getComponent(v, c);
    }
    g.setAttribute(name, new THREE.BufferAttribute(arr, k, a.normalized));
  }
  g.morphAttributes = {};
  g.setIndex(new THREE.BufferAttribute(newIdx, 1));
  return g;
}

// 减面（同 convert.html）：只删三角形不动顶点，贴图坐标保留
async function simplify(root, target) {
  let total = 0;
  root.traverse(o => { if (o.isMesh) total += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  if (!target || total <= target) return;
  await MeshoptSimplifier.ready;
  const ratio = target / total;
  root.traverse(m => {
    if (!m.isMesh) return;
    const src = m.geometry, groups = src.groups.map(g => ({ ...g }));
    const g = src.index ? src : mergeVertices(src, 1e-5);
    const idx = g.index.array, pos = g.attributes.position.array;
    const ranges = groups.length ? groups : [{ start: 0, count: idx.length, materialIndex: 0 }];
    const out = [], ng = [];
    for (const r of ranges) {
      const sub = new Uint32Array(idx.subarray(r.start, r.start + r.count));
      const [res] = MeshoptSimplifier.simplify(sub, pos, 3, Math.max(3, Math.floor(sub.length * ratio / 3) * 3), 0.02, []);
      ng.push({ start: out.length, count: res.length, materialIndex: r.materialIndex });
      for (let i = 0; i < res.length; i++) out.push(res[i]);
    }
    g.setIndex(new THREE.BufferAttribute(new Uint32Array(out), 1));
    g.clearGroups();
    if (groups.length) for (const x of ng) g.addGroup(x.start, x.count, x.materialIndex);
    m.geometry = compactGeometry(g);
  });
}

const toB64 = buf => {
  const bytes = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};

// 模型：只保留颜色贴图 + 法线贴图，压到 maxTex，存 JPEG
window.convertModel = async (url, maxTex = 512, target = 0) => {
  const gltf = await new GLTFLoader().loadAsync(url);
  const root = gltf.scene;
  await simplify(root, target);
  let tris = 0;
  root.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry;
    tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    const slim = m => {
      for (const t of [m.map, m.normalMap]) if (t) t.userData.mimeType = 'image/jpeg';
      return new THREE.MeshStandardMaterial({ name: m.name, map: m.map, normalMap: m.normalMap, color: m.color, roughness: 0.85, metalness: 0, transparent: m.transparent, alphaTest: m.alphaTest, side: m.side });
    };
    o.material = Array.isArray(o.material) ? o.material.map(slim) : slim(o.material);
  });
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()).toArray();
  const glb = await new GLTFExporter().parseAsync(root, { binary: true, maxTextureSize: maxTex });
  return { b64: toB64(glb), tris: Math.round(tris), size };
};

// 贴图：缩到 size×size，JPEG 质量 0.82
window.resizeTexture = async (url, size = 512) => {
  const img = new Image();
  img.src = url;
  await img.decode();
  const c = document.createElement('canvas');
  c.width = c.height = size;
  c.getContext('2d').drawImage(img, 0, 0, size, size);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  return toB64(await blob.arrayBuffer());
};
window.__ready = true;
</script></body></html>
